name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: tsungmn/sheet-forge-api
  CONFIG_REPO: tsungmnli/sheet-forge-config
  CONFIG_DIR: overlays/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # DB 통합 테스트는 테이블을 만들고 지운다. 테스트 전용 DB를 바로 만들어 둔다.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sheet_forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 이 값이 없으면 DB 통합 테스트가 전부 건너뛰어진다(초록불이어도 DB는 검증 안 됨).
      SHEET_FORGE_TEST_DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5432/sheet_forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13" # Dockerfile과 같은 버전
      - run: uv sync --frozen
      - run: uv run pytest -q -rs

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-sheet-forge-api
      cancel-in-progress: false # never abandon a half-finished tag bump
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: tsungmn
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # arm64를 빼면 QEMU가 필요 없어 빌드가 크게 빨라진다
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Argo CD watches the config repo; changing the image tag there is the deploy.
      # CONFIG_REPO_TOKEN: fine-grained PAT, repo = sheet-forge-config only, Contents: Read and write.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set the new image tag
        working-directory: config/${{ env.CONFIG_DIR }}
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"

      - name: Commit and push (retry if another push landed first)
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CONFIG_DIR}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "tag already up to date"
            exit 0
          fi
          git commit -m "api: ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
